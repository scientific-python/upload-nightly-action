name: Keep workflows alive

on:
  # Run on the first of each month at 1:23 UTC
  schedule:
  - cron:  '23 1 1 * *'
  workflow_dispatch:

jobs:
  deploy:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Create a minimal payload
      run: |
        mkdir _pass
        touch _pass/pass.txt

    - name: Keep workflow alive
      uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 #v4.1.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: keep-alive
        publish_dir: _pass
        enable_jekyll: true  # avoid extra files
        force_orphan: true  # overwirte
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'
        commit_message: Keep repo GitHub Actions alive

  report-failure:
    needs: [deploy]
    if: failure() && github.event_name == 'schedule'
    permissions:
      issues: write
    uses: ./.github/workflows/report-failure.yml
    with:
      title: 'The workflow keep-alive is failing'

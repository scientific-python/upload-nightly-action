name: Report stale wheels

on:
  # Run daily at 0:23 UTC, an hour before "Remove old wheels"
  schedule:
  - cron:  '23 0 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report findings without opening or closing any issues'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:

    runs-on: ubuntu-latest
    if: github.repository_owner == 'scientific-python'
    # Needed to open an issue here if we cannot reach a project's own tracker
    permissions:
      issues: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: '3.14'

      - name: Check for stale wheels
        env:
          ISSUE_OPENER_TOKEN: ${{ secrets.ISSUE_OPENER_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run --with-requirements tools/requirements.txt tools/check_stale_wheels.py \
            --site site ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Upload the status page
        if: inputs.dry_run != true
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site

  deploy:
    # https://scientific-python.github.io/upload-nightly-action/ — from real runs only,
    # so the page never shows "would open"
    needs: [report]
    if: inputs.dry_run != true
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy the status page
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1

  report-failure:
    needs: [report, deploy]
    if: failure() && github.event_name == 'schedule'
    permissions:
      issues: write
    uses: ./.github/workflows/report-failure.yml
    with:
      title: 'The stale nightly wheel check is failing'

name: Report stale wheels

on:
  # Run daily at 0:23 UTC, an hour before "Remove old wheels"
  schedule:
  - cron:  '23 0 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report findings without opening or closing any issues'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:

    runs-on: ubuntu-latest
    if: github.repository_owner == 'scientific-python'
    # Needed to open an issue here if we cannot reach a project's own tracker
    permissions:
      issues: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          python-version: '3.13'

      - name: Check for stale wheels
        env:
          ISSUE_OPENER_TOKEN: ${{ secrets.ISSUE_OPENER_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run --frozen tools/check_stale_wheels.py ${{ inputs.dry_run && '--dry-run' || '' }}

      # A scheduled job that quietly stops working is exactly the failure mode this
      # workflow exists to prevent, so make it noisy about itself too.
      - name: Report that this workflow failed
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: The stale nightly wheel check is failing
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="[This run](${RUN_URL}) of \`${GITHUB_WORKFLOW}\` failed, so projects whose nightly
          wheels are about to be removed from the channel are no longer being notified."

          number=$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --json number,title \
              --jq 'map(select(.title == env.TITLE)) | .[0].number // ""')

          if [ -n "${number}" ]; then
              gh issue comment "${number}" --repo "${GITHUB_REPOSITORY}" --body "${body}"
          else
              gh issue create --repo "${GITHUB_REPOSITORY}" --title "${TITLE}" --body "${body}"
          fi
